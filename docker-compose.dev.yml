services:
  # ========== API ==========
  api:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts
      - file_storage:/data/files
      - ./pipeline/results:/app/pipeline/results:ro  # Read-only access to pipeline results for downloads
    environment:
      - DATABASE_URL=postgresql+asyncpg://genenote:${POSTGRES_PASSWORD:-changeme}@db:5432/genenote
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FILE_STORAGE_PATH=/data/files
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-secret-key}
      - DEBUG=true
      - ENVIRONMENT=development
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - genenote-network

  # ========== Worker (Kafka Consumer) ==========
  worker:
    build:
      context: .
      target: worker
    volumes:
      - file_storage:/data/files
      - ./pipeline/results:/app/pipeline/results        # Bind mount for local testing
      - ./pipeline/uploaded:/app/pipeline/uploaded      # Bind mount for local testing
      - ./pipeline/references:/app/pipeline/references
      - ./pipeline/data_bases:/app/pipeline/data_bases
      - ./scripts:/app/scripts                          # Download scripts
      - vep_cache:/app/vep_cache                        # VEP cache (download with scripts/download_vep_cache.sh)
    environment:
      - DATABASE_URL=postgresql+asyncpg://genenote:${POSTGRES_PASSWORD:-changeme}@db:5432/genenote
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FILE_STORAGE_PATH=/data/files
      - PIPELINE_PATH=/app/pipeline
      - XDG_CACHE_HOME=/tmp/.cache
      - SNAKEMAKE_OUTPUT_CACHE=/tmp/.snakemake
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - genenote-network
    deploy:
      replicas: 1

  # ========== PostgreSQL ==========
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=genenote
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=genenote
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genenote"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genenote-network

  # ========== Kafka (KRaft mode) ==========
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "genenote-kafka-cluster-01"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - genenote-network

  # ========== Kafka UI (Development) ==========
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=genenote
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - genenote-network
    profiles:
      - dev

volumes:
  postgres_data:
  kafka_data:
  file_storage:
  pipeline_results:
  pipeline_uploaded:
  vep_cache:            # VEP annotation cache (~23GB, download once)

networks:
  genenote-network:
    driver: bridge
